<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Guide language settings</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">AI TOUR GUIDE</p>
      <h1>Guide language settings</h1>
      <p class="intro"></p>
      <section aria-label="Language settings">
        <label><span data-label="uiLanguage"></span><select name="uiLanguage"></select></label>
        <label><span data-label="guidePromptLanguage"></span><select name="guidePromptLanguage"></select></label>
        <label><span data-label="guideNarrationLanguage"></span><select name="guideNarrationLanguage"></select></label>
        <label><span data-label="publicPlaybackLanguage"></span><select name="publicPlaybackLanguage"></select></label>
        <label><span data-label="visitorLanguage"></span><select name="visitorLanguage"></select></label>
      </section>
      <p class="status" role="status" aria-live="polite"></p>
    </main>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
