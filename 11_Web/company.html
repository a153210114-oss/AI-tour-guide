<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d3b32" />
    <title>公司管理 · ALONORA</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="company-page">
    <header class="company-topbar">
      <a href="/" class="company-brand"><img src="/assets/alonora-logo-card.jpg" alt="ALONORA" /></a>
      <div><span>公司试用后台</span><strong id="company-heading">Company</strong></div>
    </header>
    <main class="company-main">
      <section class="company-intro">
        <p class="eyebrow">COMPANY OPERATIONS</p>
        <h1>批量派单与导游频道监控</h1>
        <p>导游是持续身份，车辆只是当天排单属性。游客二维码由导游手机临时展示，公司可按导游查看并进入其收听频道。</p>
        <span class="pilot-badge">试用版 · 数据暂未永久保存</span>
      </section>
      <section class="company-card dispatch-import">
          <div class="company-card-title"><span>01</span><div><h2>批量导入今日排单</h2><p>一次导入 20、50 辆车；系统按人匹配导游，再分配当天车辆、线路和产品。</p></div></div>
        <div class="dispatch-toolbar">
          <label class="file-button">选择 CSV 文件<input id="dispatch-file" type="file" accept=".csv,text/csv,text/plain" /></label>
          <button type="button" id="load-dispatch-example">载入示例</button>
        </div>
        <label>排单内容（CSV 或制表符表格）
          <textarea id="dispatch-data" class="dispatch-data" placeholder="日期,车辆,导游编号,导游姓名,线路,产品,天数,接客地点"></textarea>
        </label>
        <p class="dispatch-help">列顺序：日期、车辆、导游编号、导游姓名、线路、产品、天数、接客地点。首行标题可保留。</p>
        <button class="company-primary" id="import-dispatches" type="button">解析并分配全部排单</button>
        <div id="dispatch-result" class="dispatch-result hidden"></div>
      </section>
      <div class="company-columns company-profile-only">
        <section class="company-card">
          <div class="company-card-title"><span>02</span><h2>公司资料</h2></div>
          <form id="company-profile-form">
            <label>公司名称<input id="company-name" required maxlength="80" /></label>
            <label>公司 Logo<input id="company-logo-file" type="file" accept="image/png,image/jpeg,image/webp" /><small>PNG、JPG 或 WebP，建议透明背景</small></label>
            <div class="company-logo-preview" id="company-logo-preview"><span>公司 Logo</span></div>
            <button class="company-primary" type="submit">保存公司资料</button>
          </form>
        </section>
      </div>
      <section class="company-card company-guides">
        <div class="company-card-title"><span>03</span><div><h2>今日导游频道列表</h2><p>按导游选择要收听的频道。车辆仅显示当天分配，不承载固定二维码。</p></div></div>
        <div id="company-guide-list" class="company-guide-list"></div>
      </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="/shared.js"></script>
    <script src="/company.js"></script>
  </body>
</html>
