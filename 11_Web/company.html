<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d3b32" />
    <title>公司管理 · ALONORA</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="company-page">
    <header class="company-topbar">
      <a href="/" class="company-brand"><img src="/assets/alonora-logo-card.jpg" alt="ALONORA" /></a>
      <div><span>公司试用后台</span><strong id="company-heading">Company</strong></div>
    </header>
    <main class="company-main">
      <section class="company-intro">
        <p class="eyebrow">COMPANY OPERATIONS</p>
        <h1>公司标识、导游编号与游客入口</h1>
        <p>每位导游拥有公司内部唯一编号与专属二维码。游客扫码进入该导游当前行程的对话页面。</p>
        <span class="pilot-badge">试用版 · 数据暂未永久保存</span>
      </section>
      <div class="company-columns">
        <section class="company-card">
          <div class="company-card-title"><span>01</span><h2>公司资料</h2></div>
          <form id="company-profile-form">
            <label>公司名称<input id="company-name" required maxlength="80" /></label>
            <label>公司 Logo<input id="company-logo-file" type="file" accept="image/png,image/jpeg,image/webp" /><small>PNG、JPG 或 WebP，建议透明背景</small></label>
            <div class="company-logo-preview" id="company-logo-preview"><span>公司 Logo</span></div>
            <button class="company-primary" type="submit">保存公司资料</button>
          </form>
        </section>
        <section class="company-card">
          <div class="company-card-title"><span>02</span><h2>新增导游</h2></div>
          <form id="guide-form">
            <label>导游编号<input id="guide-number" required placeholder="例如 G-002" maxlength="24" /></label>
            <label>导游姓名<input id="guide-name" required placeholder="姓名" maxlength="60" /></label>
            <label>分配产品 / 线路<input id="guide-route" placeholder="例如 Great Ocean Road · Day Tour" maxlength="100" /></label>
            <button class="company-primary" type="submit">建立导游并生成二维码</button>
          </form>
        </section>
      </div>
      <section class="company-card company-guides">
        <div class="company-card-title"><span>03</span><div><h2>导游与二维码</h2><p>二维码可下载、打印或放在车辆座椅背面。</p></div></div>
        <div id="company-guide-list" class="company-guide-list"></div>
      </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="/shared.js"></script>
    <script src="/company.js"></script>
  </body>
</html>
